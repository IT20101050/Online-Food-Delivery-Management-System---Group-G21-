<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeDash - Update Status</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: #121212;
            border-right: 1px solid #2a2a2a;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            color: #d4af37;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .brand-sub {
            color: #888;
            font-size: 10px;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .menu-title {
            color: #666;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .menu-item {
            color: #a0a0a0;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .menu-item.active {
            background-color: #1a1813;
            color: #d4af37;
            border: 1px solid #4a3c17;
        }

        .menu-item:hover:not(.active) {
            background-color: #1a1a1a;
            color: #fff;
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            background-color: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #fff;
        }

        .form-desc {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #d4af37;
            background-color: #222;
        }

        select option {
            background-color: #1a1a1a;
            color: #fff;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-primary {
            background-color: #d4af37;
            color: #000;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            flex: 1;
            text-align: center;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background-color: #c5a028;
        }

        .btn-outline {
            background-color: transparent;
            color: #aaa;
            border: 1px solid #333;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            flex: 1;
            text-align: center;
            transition: 0.3s;
        }

        .btn-outline:hover {
            border-color: #555;
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand">PRIMEDASH</div>
    <div class="brand-sub">EXCEPTIONAL. DELIVERED.</div>

    <div class="menu-title">WORKSPACE</div>
    <a href="delivery-dashboard.html" class="menu-item">Delivery dashboard</a>
    <a href="assign-driver.html" class="menu-item">Assign driver</a>
    <a href="update-status.html" class="menu-item active">Update status</a>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="form-card">
        <h2>Update Status</h2>
        <p class="form-desc">Modify the current progression state of an active delivery.</p>

        <form action="delivery-dashboard.html" method="GET">
            <div class="form-group">
                <label for="deliveryId">Delivery ID</label>
                <input type="text" id="deliveryId" name="deliveryId" placeholder="e.g., #DLV-2089" required>
            </div>

            <div class="form-group">
                <label for="status">New Status</label>
                <select id="status" name="status">
                    <option value="Pending">Pending</option>
                    <option value="Preparing">Preparing</option>
                    <option value="On the Way">On the Way</option>
                    <option value="Delivered">Delivered</option>
                </select>
            </div>

            <div class="form-actions">
                <a href="delivery-dashboard.html" class="btn-outline">Cancel</a>
                <button type="submit" class="btn-primary">Update Status</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
