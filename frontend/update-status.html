<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Status</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<h2>Update Delivery Status</h2>

<form action="updateStatusServlet" method="POST">
    <label for="deliveryId">Delivery ID:</label><br>
    <input type="text" id="deliveryId" name="deliveryId" required><br><br>

    <label for="status">New Status:</label><br>
    <select id="status" name="status">
        <option value="Pending">Pending</option>
        <option value="Preparing">Preparing</option>
        <option value="On the Way">On the Way</option>
        <option value="Delivered">Delivered</option>
    </select><br><br>

    <button type="submit">Update Status</button>
    <a href="delivery-dashboard.html"><button type="button">Cancel</button></a>
</form>
</body>
</html>
